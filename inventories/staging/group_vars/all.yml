---
ansible_user: ubuntu
ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/.ssh/hangar_ansible"
ansible_ssh_common_args: >-
  -o IdentitiesOnly=yes
  -o UserKnownHostsFile={{ lookup('env', 'HOME') }}/.ssh/known_hosts.hangar
  -o ProxyCommand="hangar ssh-proxy vm %n -p destrier-5n7qg"
ansible_python_interpreter: /usr/bin/python3
